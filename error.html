{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl w-full bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-gray-800 text-center">
    <div class="text-5xl text-blue-600 mb-4"><i class="fa-solid fa-circle-question" aria-hidden="true"></i></div>
    <h1 class="text-3xl font-bold mb-3">{{ heading }}</h1>
    <p class="text-gray-600 mb-6">{{ message }}</p>
    <p class="text-gray-600 mb-6">Converted files are deleted automatically after 1 hour, so an old download link stops working after that. Just convert the file again.</p>
    <div class="flex flex-wrap justify-center gap-3">
        <a href="/#tools" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-lg transition">Browse all tools</a>
        <a href="/blog" class="bg-white border border-gray-300 hover:border-blue-600 text-gray-700 font-bold px-5 py-2 rounded-lg transition">Read the guides</a>
    </div>
</div>
{% endblock %}
