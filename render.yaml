services:
  - type: web
    name: purefileconverter
    env: docker
    plan: free
    autoDeploy: false
    envVars:
      - key: MAX_UPLOAD_MB
        value: 10
      - key: SITE_URL
        value: https://purefileconverter.com
      - key: CONTACT_EMAIL
        value: support@purefileconverter.com
      - key: ADSENSE_CLIENT_ID
        value: ""
