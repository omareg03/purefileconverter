<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#f0fdf4"/>
  <text x="360" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#16a34a">WebP vs JPG vs PNG</text>
  <text x="360" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#6b7280">Which image format should you use?</text>
  <!-- File size bars -->
  <rect x="100" y="130" width="500" height="40" rx="8" fill="#fee2e2"/>
  <text x="110" y="156" font-family="Arial" font-size="16" font-weight="bold" fill="#dc2626">PNG — 450 KB (Lossless, large)</text>
  <rect x="100" y="185" width="280" height="40" rx="8" fill="#fef3c7"/>
  <text x="110" y="211" font-family="Arial" font-size="16" font-weight="bold" fill="#d97706">JPG — 120 KB (Lossy, small)</text>
  <rect x="100" y="240" width="180" height="40" rx="8" fill="#dcfce7"/>
  <text x="110" y="266" font-family="Arial" font-size="16" font-weight="bold" fill="#16a34a">WebP — 80 KB (Best compression)</text>
  <text x="360" y="330" font-family="Arial" font-size="14" text-anchor="middle" fill="#6b7280">WebP: 30-50% smaller than JPG, same quality</text>
</svg>
