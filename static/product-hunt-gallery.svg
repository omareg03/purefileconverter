<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>

  <!-- Logo icon centered -->
  <g transform="translate(245, 40) scale(1.5)">
    <path d="M50 15 A35 35 0 0 1 85 50 L95 50 L80 70 L65 50 L75 50 A25 25 0 0 0 50 25 Z" fill="white" opacity="0.95"/>
    <path d="M50 85 A35 35 0 0 1 15 50 L5 50 L20 30 L35 50 L25 50 A25 25 0 0 0 50 75 Z" fill="#4ade80"/>
  </g>

  <!-- Brand name -->
  <text x="320" y="195" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="white">
    PureFileConverter
  </text>

  <!-- Tagline -->
  <text x="320" y="235" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#bfdbfe">
    12 free file conversion tools — no signup, no watermark
  </text>

  <!-- Tool icons grid -->
  <g transform="translate(70, 280)">
    <!-- Row 1: Document tools -->
    <g transform="translate(0, 0)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">PDF→Word</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">📄</text>
    </g>
    <g transform="translate(90, 0)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">Word→PDF</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">📝</text>
    </g>
    <g transform="translate(180, 0)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">CSV→XLSX</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">📊</text>
    </g>
    <g transform="translate(270, 0)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">XLSX→PDF</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">📈</text>
    </g>

    <!-- Row 2: Image tools -->
    <g transform="translate(0, 85)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">Resize</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">🖼️</text>
    </g>
    <g transform="translate(90, 85)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">Compress</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">🗜️</text>
    </g>
    <g transform="translate(180, 85)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">Convert</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">🔄</text>
    </g>
    <g transform="translate(270, 85)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">Img→PDF</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">📷</text>
    </g>

    <!-- Row 3: Media tools -->
    <g transform="translate(0, 170)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">MP4→MP3</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">🎵</text>
    </g>
    <g transform="translate(90, 170)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">WAV→MP3</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">🔊</text>
    </g>
    <g transform="translate(180, 170)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">AVI→MP4</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">🎬</text>
    </g>
    <g transform="translate(270, 170)">
      <rect width="80" height="70" rx="12" fill="white" opacity="0.15"/>
      <text x="40" y="30" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#bfdbfe">MP3→MP4</text>
      <text x="40" y="50" font-family="Arial" font-size="20" text-anchor="middle" fill="white">📹</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="320" y="455" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#93c5fd">
    No signup · No watermark · Files auto-deleted after 1 hour
  </text>
</svg>
