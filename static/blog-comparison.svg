<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#faf5ff"/>
  <!-- Three cards comparison -->
  <rect x="20" y="30" width="210" height="260" rx="16" fill="white" stroke="#ddd6fe" stroke-width="2"/>
  <text x="125" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#7c3aed">iLovePDF</text>
  <circle cx="125" cy="100" r="25" fill="#f3e8ff"/>
  <text x="125" y="108" font-family="Arial" font-size="24" text-anchor="middle" fill="#7c3aed">PDF</text>
  <rect x="40" y="140" width="170" height="6" rx="3" fill="#ede9fe"/>
  <rect x="40" y="160" width="150" height="6" rx="3" fill="#ede9fe"/>
  <rect x="40" y="180" width="160" height="6" rx="3" fill="#ede9fe"/>
  <text x="125" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#9333ea">Signup required</text>
  <text x="125" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#9333ea">Watermark on free</text>

  <rect x="255" y="30" width="210" height="260" rx="16" fill="white" stroke="#bfdbfe" stroke-width="2"/>
  <text x="360" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563eb">Smallpdf</text>
  <circle cx="360" cy="100" r="25" fill="#eff6ff"/>
  <text x="360" y="108" font-family="Arial" font-size="24" text-anchor="middle" fill="#2563eb">PDF</text>
  <rect x="275" y="140" width="170" height="6" rx="3" fill="#dbeafe"/>
  <rect x="275" y="160" width="150" height="6" rx="3" fill="#dbeafe"/>
  <rect x="275" y="180" width="160" height="6" rx="3" fill="#dbeafe"/>
  <text x="360" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#2563eb">2 tasks per day</text>
  <text x="360" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#2563eb">Free tier limited</text>

  <rect x="490" y="20" width="210" height="270" rx="16" fill="white" stroke="#4ade80" stroke-width="3"/>
  <text x="595" y="55" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#16a34a">PureFile</text>
  <circle cx="595" cy="90" r="25" fill="#dcfce7"/>
  <text x="595" y="98" font-family="Arial" font-size="20" text-anchor="middle" fill="#16a34a">12</text>
  <rect x="510" y="130" width="170" height="6" rx="3" fill="#bbf7d0"/>
  <rect x="510" y="150" width="150" height="6" rx="3" fill="#bbf7d0"/>
  <rect x="510" y="170" width="160" height="6" rx="3" fill="#bbf7d0"/>
  <text x="595" y="215" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#16a34a">No signup</text>
  <text x="595" y="235" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#16a34a">No watermark</text>
  <text x="595" y="255" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#16a34a">12 tools free</text>

  <text x="360" y="330" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">iLovePDF vs Smallpdf vs PureFileConverter</text>
  <text x="360" y="355" font-family="Arial" font-size="14" text-anchor="middle" fill="#6b7280">Which free file converter is best?</text>
</svg>
