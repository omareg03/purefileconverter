<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#fef3c7"/>
  <text x="360" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#92400e">10 Best Free File Converters in 2026</text>
  <!-- Trophy/podium: three equal-width bars, heights descending 1 > 2 > 3, labels centered -->
  <!-- #2 (left, middle height) -->
  <rect x="160" y="305" width="110" height="55" rx="8" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
  <text x="215" y="338" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#6b7280">#2</text>
  <!-- #1 (center, tallest) -->
  <rect x="305" y="280" width="110" height="80" rx="8" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="326" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#92400e">#1</text>
  <!-- #3 (right, shortest) -->
  <rect x="450" y="325" width="110" height="35" rx="8" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
  <text x="505" y="348" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#a16207">#3</text>
  <!-- Stars -->
  <text x="360" y="180" font-family="Arial" font-size="40" text-anchor="middle">⭐</text>
  <text x="360" y="230" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#92400e">Free · Fast · No Watermark</text>
</svg>
